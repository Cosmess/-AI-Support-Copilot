name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -e .[dev]

      - name: Lint
        run: ruff check src tests

      - name: Tests
        run: pytest -q

      - name: Basic validation
        run: python -m compileall src
